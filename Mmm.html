<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดที่นั่งห้องเรียน</title>
  <!-- ดึง Google Fonts (Kanit & Plus Jakarta Sans) สำหรับ UI แบบ Modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-success: #10b981;
      --accent-success-border: #059669;
      --desk-bg: #f1f5f9;
      --desk-border: #cbd5e1;
      --radius-sm: 10px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Kanit', 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 30px 15px;
      margin: 0;
    }

    .main-container {
      background: var(--card-bg);
      padding: 35px 30px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid #e2e8f0;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
      margin: 0 0 6px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 300;
      margin: 0;
    }

    /* โซนกระดานดำหน้าห้อง */
    .blackboard {
      background: linear-gradient(135deg, #1e293b, #334155);
      color: #f8fafc;
      width: 100%;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1.5px;
      margin-bottom: 25px;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
    }

    /* ตารางพื้นที่ห้องเรียน */
    .classroom-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 25px;
    }

    /* ช่องที่นั่ง / โต๊ะเรียน */
    .desk {
      background-color: var(--desk-bg);
      border: 1.5px solid var(--desk-border);
      aspect-ratio: 1;
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 12px;
      font-weight: 400;
      color: var(--text-muted);
      user-select: none;
    }

    .desk:hover {
      border-color: var(--accent-primary);
      background-color: #e0e7ff;
      color: var(--accent-primary);
      transform: translateY(-2px);
    }

    /* เมื่อเลือกที่นั่ง */
    .desk.active {
      background-color: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
      font-weight: 500;
    }

    /* เมื่อสุ่มเลือกเลขที่แล้ว */
    .desk.assigned {
      background-color: var(--accent-success);
      border-color: var(--accent-success-border);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.25);
      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .desk.assigned .num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.1;
    }

    .desk.assigned .label {
      font-size: 10px;
      opacity: 0.9;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* ส่วนควบคุมและปุ่มกด */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    .status-badge {
      background-color: #f1f5f9;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      color: var(--text-main);
      font-weight: 400;
    }

    .status-badge span {
      color: var(--accent-primary);
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Kanit', sans-serif;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .btn-random {
      background-color: var(--accent-primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }

    .btn-random:hover:not(:disabled) {
      background-color: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    .btn-random:disabled {
      background-color: #e2e8f0;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-reset {
      background-color: #f1f5f9;
      color: var(--text-main);
      border: 1px solid #e2e8f0;
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
    }

    /* Responsive ปรับการแสดงผลหน้าจอมือถือ */
    @media (max-width: 480px) {
      .main-container {
        padding: 20px 15px;
      }
      .classroom-grid {
        gap: 6px;
      }
      .desk {
        font-size: 10px;
        border-radius: 6px;
      }
      .desk.assigned .num {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <header>
      <h2>🏫 ระบบจัดที่นั่งห้องเรียน ม.1/11</h2>
      <p class="subtitle">เลือกตำแหน่งโต๊ะที่ต้องการ แล้วกดปุ่มสุ่มเพื่อเริ่มใช้งาน</p>
    </header>

    <!-- หน้าห้องเรียน -->
    <div class="blackboard">🖥️ หน้าห้อง / กระดานดำ</div>

    <!-- ตารางที่นั่ง -->
    <div class="classroom-grid" id="classroomGrid"></div>

    <!-- ปุ่มควบคุม -->
    <div class="controls">
      <div class="status-badge">
        เลือกที่นั่งแล้ว: <span id="seatCount">0</span> ที่นั่ง
      </div>

      <div class="btn-group">
        <button class="btn-random" id="btnRandom" disabled>
          🔀 สุ่มเลขที่เข้าที่นั่ง
        </button>
        <button class="btn-reset" id="btnReset">
          🔄 เริ่มใหม่
        </button>
      </div>
    </div>
  </div>

  <script>
    const gridContainer = document.getElementById('classroomGrid');
    const seatCountDisplay = document.getElementById('seatCount');
    const btnRandom = document.getElementById('btnRandom');
    const btnReset = document.getElementById('btnReset');

    const TOTAL_CELLS = 64; // 8 x 8
    let selectedSeats = []; 
    let isAssigned = false; 

    // 1. สร้างตารางจำลองห้องเรียน
    function createGrid() {
      gridContainer.innerHTML = '';
      selectedSeats = [];
      isAssigned = false;
      btnRandom.disabled = true;
      seatCountDisplay.innerText = '0';

      for (let i = 0; i < TOTAL_CELLS; i++) {
        const desk = document.createElement('div');
        desk.classList.add('desk');
        desk.innerText = 'ว่าง';

        // ดักจับการคลิกเลือกที่นั่ง
        desk.addEventListener('click', () => {
          if (isAssigned) return;

          if (desk.classList.contains('active')) {
            desk.classList.remove('active');
            desk.innerText = 'ว่าง';
            selectedSeats = selectedSeats.filter(item => item !== desk);
          } else {
            desk.classList.add('active');
            desk.innerText = 'โต๊ะ';
            selectedSeats.push(desk);
          }

          seatCountDisplay.innerText = selectedSeats.length;
          btnRandom.disabled = selectedSeats.length === 0;
        });

        gridContainer.appendChild(desk);
      }
    }

    // 2. ฟังก์ชันสุ่มเลขที่นักเรียน
    function randomAssignSeats() {
      if (selectedSeats.length === 0) return;

      const studentCount = selectedSeats.length; 

      let studentNumbers = [];
      for (let i = 1; i <= studentCount; i++) {
        studentNumbers.push(i);
      }

      // Fisher-Yates Shuffle Algorithm
      for (let i = studentNumbers.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [studentNumbers[i], studentNumbers[j]] = [studentNumbers[j], studentNumbers[i]];
      }

      selectedSeats.forEach((desk, index) => {
        desk.classList.remove('active');
        desk.classList.add('assigned');
        desk.innerHTML = `
          <span class="label">เลขที่</span>
          <span class="num">${studentNumbers[index]}</span>
        `;
      });

      isAssigned = true;
      btnRandom.disabled = true; 
    }

    btnRandom.addEventListener('click', randomAssignSeats);
    btnReset.addEventListener('click', createGrid);

    // เริ่มต้นระบบครั้งแรก
    createGrid();
  </script>
</body>
</html>
