<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peach Link Generator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#312e81);
    color:white;
    padding:25px;
}

.container{
    max-width:900px;
    margin:auto;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:25px;
    backdrop-filter:blur(15px);
}

h1{
    text-align:center;
}

p{
    text-align:center;
    color:#c7d2fe;
}

textarea{
    width:100%;
    height:350px;
    background:#020617;
    color:#e2e8f0;
    border:1px solid #475569;
    border-radius:14px;
    padding:15px;
    font-family:monospace;
    font-size:14px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
    flex-wrap:wrap;
}

button{
    flex:1;
    min-width:140px;
    border:0;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    color:white;
    background:#6366f1;
    cursor:pointer;
}

button:hover{
    background:#4f46e5;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    background:#020617;
}

.link{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:#a5b4fc;
}

.copy{
    margin-top:10px;
    width:100%;
    background:#10b981;
}

.open{
    margin-top:10px;
    width:100%;
    background:#f59e0b;
}

.status{
    text-align:center;
    margin-top:10px;
    color:#86efac;
}
</style>
</head>

<body>

<div class="container">

<h1>🔗 Peach Link Generator</h1>

<p>วางโค้ด HTML แล้วสร้างลิงก์ HTTPS ของคุณ</p>

<textarea id="code" placeholder="วางโค้ด HTML ของคุณที่นี่..."></textarea>

<div class="buttons">
<button onclick="createLink()">🚀 สร้างลิงก์</button>
<button onclick="preview()">👁️ Preview</button>
<button onclick="clearCode()">🗑️ ล้าง</button>
</div>

<div class="result" id="result">

<h2>🎉 ลิงก์ของคุณ</h2>

<input class="link" id="link" readonly>

<button class="copy" onclick="copyLink()">
📋 คัดลอกลิงก์
</button>

<button class="open" onclick="openLink()">
🌐 เปิดลิงก์
</button>

<div class="status" id="status"></div>

</div>

</div>

<script>

function createLink(){

    const code =
        document.getElementById("code").value;

    if(!code.trim()){
        alert("กรุณาวางโค้ด HTML ก่อน");
        return;
    }

    const encoded =
        btoa(
            unescape(
                encodeURIComponent(code)
            )
        );

    const url =
        location.origin +
        "/?page=" +
        encodeURIComponent(encoded);

    document.getElementById("link").value = url;

    document.getElementById("result").style.display =
        "block";

    document.getElementById("status").textContent =
        "สร้างลิงก์สำเร็จแล้ว ✅";
}

function openLink(){

    const url =
        document.getElementById("link").value;

    window.open(url,"_blank");
}

async function copyLink(){

    const url =
        document.getElementById("link").value;

    await navigator.clipboard.writeText(url);

    document.getElementById("status").textContent =
        "คัดลอกแล้ว 📋";
}

function preview(){

    const code =
        document.getElementById("code").value;

    if(!code.trim()){
        alert("กรุณาวางโค้ด HTML ก่อน");
        return;
    }

    const win = window.open();

    win.document.open();
    win.document.write(code);
    win.document.close();
}

function clearCode(){

    document.getElementById("code").value = "";

    document.getElementById("result").style.display =
        "none";
}

function loadPage(){

    const params =
        new URLSearchParams(location.search);

    const page =
        params.get("page");

    if(!page) return;

    try{

        const code =
            decodeURIComponent(
                escape(
                    atob(page)
                )
            );

        document.open();
        document.write(code);
        document.close();

    }catch(e){

        document.body.innerHTML =
            "<h1>ลิงก์ไม่ถูกต้อง</h1>";

    }
}

loadPage();

</script>

</body>
</html>
