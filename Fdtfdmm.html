<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลงข้อความผู้ใช้เป็นลิงก์พรีวิว</title>
    <!-- นำเข้าฟอนต์ Kanit จาก Google Fonts ให้ดูสวยงามทันสมัย -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 700px; /* ขยายขนาดการ์ดให้กว้างขึ้น */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            font-size: 28px; /* ขยายหัวข้อให้ใหญ่ขึ้น */
            margin-top: 0;
            margin-bottom: 10px;
        }

        p.description {
            color: #7f8c8d;
            font-size: 18px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 180px; /* ขยายช่องพิมพ์ให้ใหญ่และสูงขึ้น */
            padding: 18px;
            font-size: 18px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            resize: vertical;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        textarea:focus {
            border-color: #4A90E2;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(74, 144, 226, 0.2);
        }

        .btn-generate {
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(45deg, #4A90E2, #50E3C2);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
        }

        .btn-generate:active {
            transform: translateY(0);
        }

        /* ส่วนแสดงผลลิงก์ */
        #linkContainer {
            margin-top: 30px;
        }

        .result-card {
            background-color: #f0f8ff;
            border: 2px dashed #4A90E2;
            border-radius: 14px;
            padding: 25px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .result-card strong {
            font-size: 18px;
            color: #333;
            display: block;
            margin-bottom: 15px;
        }

        .preview-button {
            display: inline-block;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            background-color: #FF5A5F;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 90, 95, 0.3);
        }

        .preview-button:hover {
            background-color: #e0484c;
            transform: scale(1.05);
            box-shadow: 0 6px 16px rgba(255, 90, 95, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ เครื่องมือแปลงข้อความ/HTML เป็นลิงก์พรีวิว</h2>
        <p class="description">กรอกข้อความหรือโค้ด HTML เพื่อสร้างลิงก์สำหรับเปิดดูหน้าพรีวิว</p>
        
        <textarea id="userInput" placeholder="พิมพ์ข้อความหรือแท็ก HTML ที่นี่...&#10;ตัวอย่าง:&#10;<h1 style='color: #4A90E2;'>สวัสดีครับ!</h1>&#10;<p style='font-size: 20px;'>นี่คือตัวอย่างหน้าพรีวิวขนาดใหญ่</p>"></textarea>
        
        <button class="btn-generate" onclick="createPreviewLink()">🚀 สร้างลิงก์พรีวิว</button>

        <div id="linkContainer"></div>
    </div>

    <script>
        function createPreviewLink() {
            const userContent = document.getElementById('userInput').value;
            
            // เช็คกรณีไม่ได้ใส่ข้อมูล
            if (!userContent.trim()) {
                alert('กรุณากรอกข้อความหรือโค้ดก่อนสร้างลิงก์ครับ');
                return;
            }

            // สร้าง Blob และ URL ชั่วคราว
            const blob = new Blob([userContent], { type: 'text/html;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blob);
            
            // สร้างปุ่มลิงก์สไตล์สวยงาม
            const container = document.getElementById('linkContainer');
            container.innerHTML = `
                <div class="result-card">
                    <strong>🎉 สร้างลิงก์สำหรับดูพรีวิวเรียบร้อยแล้ว!</strong>
                    <a href="${blobUrl}" target="_blank" class="preview-button">
                        🔗 เปิดดูหน้าพรีวิวข้างใน
                    </a>
                </div>
            `;
        }
    </script>

</body>
</html>
