<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางนัดดูหนัง SF Cinema (8-11 ต.ค. 2569)</title>
    <!-- Tailwind CSS สำหรับตกแต่งให้สวยงามและใช้งานง่าย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 p-4 sm:p-8">
    <div class="max-w-6xl mx-auto bg-white shadow-lg rounded-2xl p-6 sm:p-8">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-bold text-red-600">🎬 นัดดูหนัง SF Cinema (รอบเช้า - เย็น)</h1>
            <p class="text-sm text-gray-500 mt-1">วันที่ 8 - 11 ตุลาคม 2569 | เลือกชื่อและติ๊กวันเวลาที่สะดวกได้เลย ระบบบันทึกอัตโนมัติ</p>
        </div>

        <!-- Add Participant Form -->
        <div class="flex gap-2 mb-6 bg-red-50 p-4 rounded-xl border border-red-100">
            <input type="text" id="userNameInput" placeholder="พิมพ์ชื่อของคุณ เช่น โอม, บี..." class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-red-500">
            <button onclick="addParticipant()" class="bg-red-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-red-700 transition">เพิ่มชื่อฉัน</button>
        </div>

        <!-- Schedule Table -->
        <div class="overflow-x-auto">
            <table class="w-full border-collapse text-left text-sm">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="p-3 border-b w-1/3">ภาพยนตร์ / รอบฉาย</th>
                        <th class="p-3 border-b text-center">พฤหัส 8 ต.ค.</th>
                        <th class="p-3 border-b text-center">ศุกร์ 9 ต.ค.</th>
                        <th class="p-3 border-b text-center">เสาร์ 10 ต.ค.</th>
                        <th class="p-3 border-b text-center">อาทิตย์ 11 ต.ค.</th>
                    </tr>
                </thead>
                <tbody id="scheduleTableBody">
                    <!-- จะถูกเติมข้อมูลด้วย JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Participants List & Reset -->
        <div class="mt-8 flex flex-col sm:flex-row justify-between items-center gap-4 border-t pt-4">
            <div>
                <span class="font-semibold text-gray-700">รายชื่อผู้เข้าร่วมทั้งหมด: </span>
                <span id="participantsList" class="text-gray-600 italic">ยังไม่มีชื่อ</span>
            </div>
            <button onclick="resetData()" class="text-sm text-red-500 hover:text-red-700 underline">รีเซ็ตข้อมูลทั้งหมด</button>
        </div>
    </div>

    <script>
        // กำหนดรอบฉายตั้งแต่เช้าถึงเย็น/ค่ำ ของทั้ง 2 เรื่อง
        const timeSlots = [
            // โดราเอมอน
            { id: 'doraemon_1', movie: '🔵 โดราเอมอน เดอะ มูฟวี่ (ตะลุยปราสาทใต้สมุทร)', label: 'รอบเช้า 10:30 น.' },
            { id: 'doraemon_2', movie: '🔵 โดราเอมอน เดอะ มูฟวี่ (ตะลุยปราสาทใต้สมุทร)', label: 'รอบเที่ยง 12:45 น.' },
            { id: 'doraemon_3', movie: '🔵 โดราเอมอน เดอะ มูฟวี่ (ตะลุยปราสาทใต้สมุทร)', label: 'รอบบ่าย 15:00 น.' },
            { id: 'doraemon_4', movie: '🔵 โดราเอมอน เดอะ มูฟวี่ (ตะลุยปราสาทใต้สมุทร)', label: 'รอบเย็น 17:15 น.' },
            
            // Attack on Titan
            { id: 'aot_1', movie: '⚔️ Attack on Titan (The Last Attack)', label: 'รอบเช้า 11:15 น.' },
            { id: 'aot_2', movie: '⚔️ Attack on Titan (The Last Attack)', label: 'รอบเที่ยง 14:00 น.' },
            { id: 'aot_3', movie: '⚔️ Attack on Titan (The Last Attack)', label: 'รอบบ่าย 16:45 น.' },
            { id: 'aot_4', movie: '⚔️ Attack on Titan (The Last Attack)', label: 'รอบค่ำ 19:30 น.' }
        ];

        const dates = ['oct8', 'oct9', 'oct10', 'oct11'];

        // โหลดข้อมูลจาก LocalStorage หรือตั้งค่าเริ่มต้น
        let data = JSON.parse(localStorage.getItem('sf_movie_data_v4')) || {
            participants: [],
            availability: {}
        };

        function renderTable() {
            const tbody = document.getElementById('scheduleTableBody');
            tbody.innerHTML = '';

            let currentMovie = '';

            timeSlots.forEach(slot => {
                // ถ้าเปลี่ยนเรื่องหนัง ให้แทรกแถวหัวข้อเรื่อง
                if (slot.movie !== currentMovie) {
                    currentMovie = slot.movie;
                    let headerTr = document.createElement('tr');
                    headerTr.innerHTML = `<td colspan="5" class="bg-gray-100 font-bold text-red-600 p-3 pt-5 text-base border-t">${currentMovie}</td>`;
                    tbody.appendChild(headerTr);
                }

                let tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                
                let tdLabel = document.createElement('td');
                tdLabel.className = 'p-3 text-gray-700 pl-6';
                tdLabel.innerText = slot.label;
                tr.appendChild(tdLabel);

                dates.forEach(date => {
                    let td = document.createElement('td');
                    td.className = 'p-3 text-center';
                    
                    let cellKey = `${slot.id}_${date}`;
                    let checkedNames = data.participants.filter(p => data.availability[`${p}_${cellKey}`]);
                    
                    let html = `<div class="flex flex-col gap-1 items-center">`;
                    
                    if(checkedNames.length > 0) {
                        html += `<div class="flex flex-wrap gap-1 justify-center mb-1">`;
                        checkedNames.forEach(name => {
                            html += `<span class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-medium">${name}</span>`;
                        });
                        html += `</div>`;
                    }

                    if(data.participants.length > 0) {
                        html += `<select onchange="updateAvailability(this, '${cellKey}')" class="text-xs border rounded p-1 bg-white">
                                    <option value="">+ กดเลือกชื่อคุณ</option>`;
                        data.participants.forEach(p => {
                            let isChecked = data.availability[`${p}_${cellKey}`] ? 'selected' : '';
                            html += `<option value="${p}" ${isChecked}>${p} (${data.availability[`${p}_${cellKey}`] ? 'ว่าง ✅' : 'ไม่ว่าง'})</option>`;
                        });
                        html += `</select>`;
                    } else {
                        html += `<span class="text-xs text-gray-400">กรอกชื่อด้านบนก่อน</span>`;
                    }

                    html += `</div>`;
                    td.innerHTML = html;
                    tr.appendChild(td);
                });

                tbody.appendChild(tr);
            });

            document.getElementById('participantsList').innerText = data.participants.length > 0 ? data.participants.join(', ') : 'ยังไม่มีชื่อ';
            localStorage.setItem('sf_movie_data_v4', JSON.stringify(data));
        }

        function addParticipant() {
            const input = document.getElementById('userNameInput');
            const name = input.value.trim();
            if(!name) {
                alert('กรุณากรอกชื่อก่อนครับ');
                return;
            }
            if(data.participants.includes(name)) {
                alert('ชื่อนี้มีอยู่ในระบบแล้วครับ');
                return;
            }
            data.participants.push(name);
            input.value = '';
            renderTable();
        }

        function updateAvailability(selectElem, cellKey) {
            const selectedName = selectElem.value;
            if(!selectedName) return;

            const key = `${selectedName}_${cellKey}`;
            data.availability[key] = !data.availability[key];
            renderTable();
        }

        function resetData() {
            if(confirm('ต้องการรีเซ็ตข้อมูลทั้งหมดใช่หรือไม่?')) {
                localStorage.removeItem('sf_movie_data_v4');
                data = { participants: [], availability: {} };
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
