<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>หนังสือคณิตศาสตร์ ม.1 - ม.6</title>

  <style>
    :root {
      --navy: #172554;
      --blue: #2563eb;
      --purple: #6d28d9;
      --green: #15803d;
      --orange: #c2410c;
      --bg: #eaf0fb;
      --paper: #fffef8;
      --ink: #1e293b;
      --muted: #64748b;
      --border: #d8dee9;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: Tahoma, "Sarabun", sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* หน้าเลือกชั้น */
    #startPage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(37, 99, 235, 0.28), transparent 27%),
        radial-gradient(circle at 85% 85%, rgba(109, 40, 217, 0.22), transparent 30%),
        #eef2ff;
    }

    .start-card {
      width: min(100%, 650px);
      padding: clamp(28px, 6vw, 52px);
      border-radius: 24px;
      text-align: center;
      background: white;
      box-shadow: 0 15px 42px rgba(15, 23, 42, 0.14);
    }

    .start-card .icon {
      margin-bottom: 12px;
      font-size: 55px;
    }

    .start-card h1 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .start-card p {
      margin: 0 0 25px;
      color: var(--muted);
      line-height: 1.8;
    }

    .start-card label {
      display: block;
      margin: 15px 0 8px;
      text-align: left;
      font-weight: 700;
    }

    .start-card select {
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .start-card select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .start-card button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      background: linear-gradient(135deg, var(--blue), var(--purple));
    }

    /* หน้าอ่านหนังสือ */
    #bookApp {
      display: none;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 13px 5%;
      color: white;
      background: var(--navy);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.16);
    }

    .brand {
      font-weight: 700;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .topbar button {
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 8px;
      color: white;
      background: transparent;
    }

    .layout {
      display: grid;
      grid-template-columns: 310px minmax(0, 1fr);
      max-width: 1600px;
      min-height: calc(100vh - 59px);
      margin: auto;
    }

    .sidebar {
      padding: 22px 15px;
      border-right: 1px solid var(--border);
      background: white;
    }

    .course-card {
      padding: 15px;
      margin-bottom: 18px;
      border-radius: 12px;
      background: #e0e7ff;
    }

    .course-card small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
    }

    .course-card strong {
      color: var(--navy);
    }

    .sidebar-title {
      margin: 20px 10px 10px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .chapter-button {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 5px;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      text-align: left;
      line-height: 1.45;
      background: transparent;
    }

    .chapter-button:hover {
      background: #f1f5f9;
    }

    .chapter-button.active {
      color: var(--navy);
      font-weight: 700;
      background: #dbeafe;
    }

    .content {
      padding: clamp(17px, 4vw, 45px);
    }

    .book-page {
      max-width: 990px;
      min-height: 78vh;
      padding: clamp(24px, 5vw, 55px);
      margin: auto;
      border: 1px solid #e8e1cf;
      background:
        linear-gradient(rgba(255, 254, 248, 0.97), rgba(255, 254, 248, 0.97)),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 31px,
          rgba(148, 163, 184, 0.08) 32px
        );
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.11);
    }

    .page-tag {
      display: inline-block;
      padding: 6px 11px;
      border-radius: 99px;
      color: #1e40af;
      font-size: 0.83rem;
      font-weight: 700;
      background: #dbeafe;
    }

    .book-page h1 {
      margin: 18px 0 10px;
      color: var(--navy);
      font-size: clamp(1.7rem, 4vw, 2.35rem);
      line-height: 1.4;
    }

    .lead {
      padding-bottom: 22px;
      border-bottom: 2px solid #cbd5e1;
      color: #475569;
      line-height: 1.95;
      font-size: 1.05rem;
    }

    .learning-box {
      padding: 18px 20px;
      margin: 25px 0;
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      background: #eff6ff;
    }

    .learning-box strong {
      display: block;
      margin-bottom: 9px;
      color: #1e40af;
    }

    .learning-box ul {
      margin: 0;
      padding-left: 22px;
      line-height: 1.85;
    }

    .lesson-section {
      margin-top: 34px;
    }

    .lesson-section h2 {
      padding-bottom: 9px;
      border-bottom: 2px solid #c7d2fe;
      color: var(--purple);
      font-size: 1.35rem;
    }

    .lesson-section p,
    .lesson-section li {
      line-height: 2;
    }

    .lesson-section ul,
    .lesson-section ol {
      padding-left: 25px;
    }

    .term-box,
    .confusion-box,
    .example-box,
    .summary-box {
      padding: 18px;
      margin: 22px 0;
      border-radius: 10px;
    }

    .term-box {
      border-left: 5px solid var(--green);
      background: #f0fdf4;
    }

    .term-box strong {
      color: #166534;
    }

    .confusion-box {
      border-left: 5px solid #f97316;
      background: #fff7ed;
    }

    .confusion-box strong {
      color: var(--orange);
    }

    .example-box {
      border-left: 5px solid var(--blue);
      background: #eff6ff;
    }

    .example-box strong {
      color: #1d4ed8;
    }

    .term-box strong,
    .confusion-box strong,
    .example-box strong {
      display: block;
      margin-bottom: 8px;
    }

    .summary-box {
      margin-top: 35px;
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--purple));
    }

    .summary-box h2 {
      margin-top: 0;
      font-size: 1.35rem;
    }

    .summary-box ul {
      margin-bottom: 0;
      padding-left: 22px;
      line-height: 1.9;
    }

    .page-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 32px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .page-actions button {
      padding: 12px 16px;
      border-radius: 9px;
      font-weight: 700;
    }

    #previousButton {
      border: 1px solid var(--border);
      color: var(--ink);
      background: white;
    }

    #nextButton {
      border: 0;
      color: white;
      background: var(--blue);
    }

    .page-actions button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: flex;
        gap: 7px;
        padding: 10px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .course-card,
      .sidebar-title {
        display: none;
      }

      .chapter-button {
        width: auto;
        flex: 0 0 auto;
        margin: 0;
        white-space: nowrap;
      }
    }

    @media (max-width: 560px) {
      .topbar-actions span {
        display: none;
      }

      .content {
        padding: 13px 9px;
      }

      .book-page {
        padding: 25px 20px;
      }

      .page-actions {
        flex-direction: column;
      }

      .page-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main id="startPage">
    <section class="start-card">
      <div class="icon">📐</div>
      <h1>หนังสือคณิตศาสตร์ ม.1–ม.6</h1>
      <p>
        เลือกระดับชั้นเพื่ออ่านเนื้อหาแบบหนังสือเรียน
        มีบทเรียน คำสำคัญ จุดที่นักเรียนมักสับสน ตัวอย่าง และสรุปท้ายบท
      </p>

      <form id="gradeForm">
        <label for="gradeSelect">เลือกชั้นเรียน</label>
        <select id="gradeSelect" required>
          <option value="" selected disabled>-- เลือกชั้นเรียน --</option>
          <option value="m1">มัธยมศึกษาปีที่ 1</option>
          <option value="m2">มัธยมศึกษาปีที่ 2</option>
          <option value="m3">มัธยมศึกษาปีที่ 3</option>
          <option value="m4">มัธยมศึกษาปีที่ 4</option>
          <option value="m5">มัธยมศึกษาปีที่ 5</option>
          <option value="m6">มัธยมศึกษาปีที่ 6</option>
        </select>

        <button type="submit">เปิดหนังสือคณิตศาสตร์ →</button>
      </form>
    </section>
  </main>

  <main id="bookApp">
    <header class="topbar">
      <div class="brand">📖 ห้องสมุดคณิตศาสตร์</div>

      <div class="topbar-actions">
        <span id="topCourseLabel"></span>
        <button type="button" id="changeGradeButton">เปลี่ยนชั้น</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="course-card">
          <small>กำลังอ่านหนังสือ</small>
          <strong id="courseLabel">คณิตศาสตร์</strong>
        </div>

        <p class="sidebar-title">สารบัญบทเรียน</p>
        <div id="chapterMenu"></div>
      </aside>

      <section class="content">
        <article class="book-page">
          <span class="page-tag" id="pageTag">บทเรียน</span>
          <h1 id="chapterTitle">กำลังโหลด...</h1>
          <p class="lead" id="chapterIntro"></p>

          <section class="learning-box">
            <strong>เมื่ออ่านบทนี้จบ ผู้เรียนควรสามารถ</strong>
            <ul id="goalsList"></ul>
          </section>

          <div id="lessonContent"></div>

          <section class="summary-box">
            <h2>สรุปท้ายบท</h2>
            <ul id="summaryList"></ul>
          </section>

          <div class="page-actions">
            <button type="button" id="previousButton">← บทก่อนหน้า</button>
            <button type="button" id="nextButton">บทถัดไป →</button>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script>
    const gradeNames = {
      m1: "คณิตศาสตร์ มัธยมศึกษาปีที่ 1",
      m2: "คณิตศาสตร์ มัธยมศึกษาปีที่ 2",
      m3: "คณิตศาสตร์ มัธยมศึกษาปีที่ 3",
      m4: "คณิตศาสตร์ มัธยมศึกษาปีที่ 4",
      m5: "คณิตศาสตร์ มัธยมศึกษาปีที่ 5",
      m6: "คณิตศาสตร์ มัธยมศึกษาปีที่ 6"
    };

    /*
      เนื้อหาเรียบเรียงใหม่สำหรับการทบทวน
      โครงสร้างหนึ่งบท:
      - title: ชื่อบท
      - intro: คำเกริ่นนำ
      - goals: สิ่งที่ควรทำได้
      - sections: เนื้อหาย่อย
      - summary: สรุปท้ายบท
    */

    const books = {
      m1: [
        {
          title: "บทที่ 1 จำนวนเต็ม",
          intro: "จำนวนเต็มใช้แทนปริมาณที่มากกว่าศูนย์ น้อยกว่าศูนย์ และศูนย์ เช่น อุณหภูมิ ระดับความสูง เงินคงเหลือ กำไร และขาดทุน การเข้าใจเส้นจำนวนช่วยให้เปรียบเทียบและคำนวณจำนวนเต็มได้อย่างมีเหตุผล",
          goals: [
            "แยกจำนวนเต็มบวก จำนวนเต็มลบ และศูนย์ได้",
            "เปรียบเทียบจำนวนเต็มบนเส้นจำนวนได้",
            "บวก ลบ คูณ และหารจำนวนเต็มได้",
            "ใช้จำนวนเต็มแก้ปัญหาในชีวิตประจำวันได้"
          ],
          sections: [
            {
              heading: "1.1 จำนวนเต็มบนเส้นจำนวน",
              paragraphs: [
                "จำนวนเต็มบวกคือจำนวนที่มากกว่าศูนย์ เช่น 1, 2, 15 ส่วนจำนวนเต็มลบคือจำนวนที่น้อยกว่าศูนย์ เช่น -1, -5, -20 และศูนย์ไม่เป็นทั้งจำนวนบวกและจำนวนลบ",
                "บนเส้นจำนวน ค่าจะเพิ่มขึ้นเมื่อเคลื่อนจากซ้ายไปขวา ดังนั้น 4 มากกว่า 1 และ -2 มากกว่า -7 เพราะ -2 อยู่ทางขวาของ -7"
              ],
              terms: [
                ["จำนวนตรงข้าม", "จำนวนสองจำนวนที่มีระยะห่างจากศูนย์เท่ากัน แต่ตั้งอยู่คนละด้าน เช่น 6 และ -6"],
                ["ค่าสัมบูรณ์", "ระยะห่างของจำนวนจากศูนย์ โดยไม่คิดเครื่องหมาย เช่น |-8| = 8"]
              ],
              confusion: "อย่าดูเฉพาะตัวเลขด้านหลังเครื่องหมายลบ เพราะ -9 มีค่าน้อยกว่า -3 แม้ 9 จะมากกว่า 3"
            },
            {
              heading: "1.2 การบวก การลบ การคูณ และการหาร",
              paragraphs: [
                "การบวกจำนวนที่มีเครื่องหมายเหมือนกัน ให้บวกค่าสัมบูรณ์แล้วใส่เครื่องหมายเดิม เช่น (-4) + (-3) = -7 การบวกจำนวนต่างเครื่องหมาย ให้หาผลต่างของค่าสัมบูรณ์แล้วใส่เครื่องหมายของจำนวนที่มีค่าสัมบูรณ์มากกว่า",
                "การลบจำนวนเต็มเปลี่ยนเป็นการบวกด้วยจำนวนตรงข้ามได้ เช่น 7 - (-5) = 7 + 5 ส่วนการคูณและหาร ถ้าเครื่องหมายเหมือนกันคำตอบเป็นบวก ถ้าเครื่องหมายต่างกันคำตอบเป็นลบ"
              ],
              example: [
                "คำนวณ 8 + (-13)",
                "เป็นการบวกต่างเครื่องหมาย จึงหาผลต่าง 13 - 8 = 5",
                "13 มีค่าสัมบูรณ์มากกว่าและเป็นจำนวนลบ",
                "ดังนั้น 8 + (-13) = -5"
              ]
            }
          ],
          summary: [
            "จำนวนเต็มมีจำนวนบวก จำนวนลบ และศูนย์",
            "จำนวนด้านขวาบนเส้นจำนวนมีค่ามากกว่า",
            "ลบจำนวนเต็มให้เปลี่ยนเป็นบวกจำนวนตรงข้าม",
            "คูณหรือหารเครื่องหมายเหมือนกันได้บวก ต่างกันได้ลบ"
          ]
        },
        {
          title: "บทที่ 2 เศษส่วน ทศนิยม และร้อยละ",
          intro: "เศษส่วน ทศนิยม และร้อยละเป็นรูปแบบต่างกันของจำนวนที่แสดงส่วนหนึ่งของทั้งหมด ความรู้เรื่องนี้ใช้กับการคิดเงิน ส่วนลด คะแนน และการเปรียบเทียบข้อมูลในชีวิตประจำวัน",
          goals: [
            "อธิบายส่วนประกอบของเศษส่วนได้",
            "เปลี่ยนเศษส่วน ทศนิยม และร้อยละกลับไปมาได้",
            "บวก ลบ คูณ และหารเศษส่วนได้",
            "คำนวณร้อยละจากสถานการณ์จริงได้"
          ],
          sections: [
            {
              heading: "2.1 เศษส่วนและเศษส่วนที่เท่ากัน",
              paragraphs: [
                "เศษส่วนเขียนในรูป a/b โดย a เรียกว่าเศษ และ b เรียกว่าส่วน ส่วนไม่สามารถเป็นศูนย์ได้ เศษส่วนบอกว่าเราแบ่งทั้งหมดออกเป็นส่วนเท่า ๆ กันกี่ส่วน และเลือกมาเท่าใด",
                "เศษส่วนที่มีค่าเท่ากันหาได้จากการคูณหรือหารทั้งเศษและส่วนด้วยจำนวนเดียวกัน เช่น 1/2 = 2/4 = 50/100 การย่อเศษส่วนช่วยให้คำตอบอยู่ในรูปอย่างต่ำ"
              ],
              terms: [
                ["เศษส่วนอย่างต่ำ", "เศษส่วนที่เศษและส่วนไม่มีตัวหารร่วมมากกว่าหนึ่ง เช่น 3/5"],
                ["จำนวนคละ", "จำนวนที่ประกอบด้วยจำนวนเต็มและเศษส่วนแท้ เช่น 2 1/3"]
              ]
            },
            {
              heading: "2.2 ทศนิยมและร้อยละ",
              paragraphs: [
                "ทศนิยมคือเศษส่วนที่มีส่วนเป็น 10, 100, 1,000 หรือกำลังของสิบ เช่น 0.25 = 25/100 ส่วนร้อยละหมายถึงจำนวนส่วนจากทุกหนึ่งร้อยส่วน จึงเขียน 25% = 25/100 = 0.25",

            "อนุพันธ์ของ xⁿ คือ nxⁿ⁻¹",
            "จุดที่อนุพันธ์เป็นศูนย์ช่วยวิเคราะห์ค่าสูงสุดต่ำสุด"
          ]
        },
        {
          title: "บทที่ 5 ปริพันธ์เบื้องต้น",
          intro: "ปริพันธ์เป็นแนวคิดย้อนกลับของอนุพันธ์ และใช้หาแนวคิดเกี่ยวกับปริมาณสะสมหรือพื้นที่ใต้กราฟในกรณีที่เหมาะสม",
          goals: [
            "เข้าใจความสัมพันธ์ระหว่างอนุพันธ์และปริพันธ์ได้",
            "หาปริพันธ์ไม่จำกัดเขตของพหุนามได้",
            "เข้าใจแนวคิดพื้นที่ใต้กราฟได้"
          ],
          sections: [
            {
              heading: "5.1 ปริพันธ์ไม่จำกัดเขต",
              paragraphs: [
                "ถ้า F'(x) = f(x) จะเรียก F(x) ว่าปริพันธ์ไม่จำกัดเขตของ f(x) เขียน ∫f(x)dx = F(x) + C โดย C เป็นค่าคงที่",
                "กฎกำลังสำหรับปริพันธ์คือ ∫xⁿdx = xⁿ⁺¹/(n+1) + C เมื่อ n ไม่เท่ากับ -1"
              ],
              confusion: "ต้องใส่ + C ในปริพันธ์ไม่จำกัดเขต เพราะอนุพันธ์ของค่าคงที่ทุกค่ามีค่าเป็นศูนย์"
            }
          ],
          summary: [
            "ปริพันธ์เป็นแนวคิดย้อนกลับของอนุพันธ์",
            "ปริพันธ์ไม่จำกัดเขตต้องมีค่าคงที่ C",
            "ปริพันธ์เกี่ยวข้องกับปริมาณสะสมและพื้นที่ใต้กราฟ"
          ]
        },
        {
          title: "บทที่ 6 การแจกแจงความน่าจะเป็นและสถิติ",
          intro: "การแจกแจงความน่าจะเป็นช่วยอธิบายค่าที่ตัวแปรสุ่มอาจเกิดขึ้น ส่วนสถิติช่วยใช้ข้อมูลตัวอย่างเพื่อวิเคราะห์และสื่อสารข้อสรุปอย่างระมัดระวัง",
          goals: [
            "เข้าใจตัวแปรสุ่มแบบไม่ต่อเนื่องได้",
            "หาค่าคาดหมายเบื้องต้นได้",
            "แปลผลข้อมูลสถิติอย่างมีวิจารณญาณได้"
          ],
          sections: [
            {
              heading: "6.1 ตัวแปรสุ่มและค่าคาดหมาย",
              paragraphs: [
                "ตัวแปรสุ่มคือค่าตัวเลขที่กำหนดให้ผลลัพธ์ของการสุ่ม เช่น จำนวนหัวจากการโยนเหรียญสองเหรียญ",
                "ค่าคาดหมาย E(X) คำนวณจากผลรวมของค่าที่เป็นไปได้คูณด้วยความน่าจะเป็นของค่านั้น ใช้อธิบายค่าเฉลี่ยระยะยาวของเหตุการณ์สุ่ม"
              ],
              example: [
                "ลูกเต๋ายุติธรรมมีค่าที่เป็นไปได้ 1 ถึง 6",
                "ค่าคาดหมาย = (1+2+3+4+5+6)/6",
                "= 21/6",
                "= 3.5 แม้จะไม่มีหน้าลูกเต๋า 3.5 ก็ตาม"
              ],
              confusion: "ค่าคาดหมายไม่จำเป็นต้องเป็นค่าที่เกิดขึ้นได้จริงในการทดลองหนึ่งครั้ง แต่เป็นค่าเฉลี่ยระยะยาว"
            }
          ],
          summary: [
            "ตัวแปรสุ่มแทนผลลัพธ์ด้วยตัวเลข",
            "ค่าคาดหมายคือค่าเฉลี่ยเชิงทฤษฎีระยะยาว",
            "ควรแยกผลจากการทดลองจริงออกจากค่าทฤษฎี"
          ]
        }
      ]
    };

    const state = {
      grade: "",
      currentChapter: 0
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => document.querySelectorAll(selector);

    function renderTerms(terms = []) {
      if (!terms.length) return "";

      return terms.map(([word, definition]) => `
        <div class="term-box">
          <strong>คำสำคัญ: ${word}</strong>
          <span>${definition}</span>
        </div>
      `).join("");
    }

    function renderExample(example) {
      if (!example) return "";

      return `
        <div class="example-box">
          <strong>ตัวอย่างทีละขั้น</strong>
          <ol>
            ${example.map((step) => `<li>${step}</li>`).join("")}
          </ol>
        </div>
      `;
    }

    function renderSections(sections) {
      return sections.map((section) => `
        <section class="lesson-section">
          <h2>${section.heading}</h2>
          ${section.paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}
          ${renderTerms(section.terms)}
          ${section.confusion ? `
            <div class="confusion-box">
              <strong>จุดที่มักสับสน</strong>
              <span>${section.confusion}</span>
            </div>
          ` : ""}
          ${renderExample(section.example)}
        </section>
      `).join("");
    }

    function renderMenu() {
      const chapters = books[state.grade];
      const menu = $("#chapterMenu");

      menu.innerHTML = chapters.map((chapter, index) => `
        <button
          type="button"
          class="chapter-button ${index === state.currentChapter ? "active" : ""}"
          data-index="${index}"
        >
          ${chapter.title}
        </button>
      `).join("");

      $$(".chapter-button").forEach((button) => {
        button.addEventListener("click", () => {
          state.currentChapter = Number(button.dataset.index);
          renderChapter();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function renderChapter() {
      const chapters = books[state.grade];
      const chapter = chapters[state.currentChapter];

      $("#courseLabel").textContent = gradeNames[state.grade];
      $("#topCourseLabel").textContent = gradeNames[state.grade];
      $("#pageTag").textContent = `คณิตศาสตร์ • ${state.grade.toUpperCase()} • บท ${state.currentChapter + 1}/${chapters.length}`;
      $("#chapterTitle").textContent = chapter.title;
      $("#chapterIntro").textContent = chapter.intro;

      $("#goalsList").innerHTML = chapter.goals
        .map((goal) => `<li>${goal}</li>`)
        .join("");

      $("#lessonContent").innerHTML = renderSections(chapter.sections);

      $("#summaryList").innerHTML = chapter.summary
        .map((item) => `<li>${item}</li>`)
        .join("");

      $("#previousButton").disabled = state.currentChapter === 0;
      $("#nextButton").disabled = state.currentChapter === chapters.length - 1;

      $("#nextButton").textContent =
        state.currentChapter === chapters.length - 1
          ? "จบเนื้อหา ม.นี้แล้ว ✓"
          : "บทถัดไป →";

      renderMenu();
    }

    $("#gradeForm").addEventListener("submit", (event) => {
      event.preventDefault();

      state.grade = $("#gradeSelect").value;
      state.currentChapter = 0;

      if (!state.grade) return;

      $("#startPage").style.display = "none";
      $("#bookApp").style.display = "block";

      renderChapter();
    });

    $("#previousButton").addEventListener("click", () => {
      if (state.currentChapter > 0) {
        state.currentChapter--;
        renderChapter();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    $("#nextButton").addEventListener("click", () => {
      const chapters = books[state.grade];

      if (state.currentChapter < chapters.length - 1) {
        state.currentChapter++;
        renderChapter();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    });

    $("#changeGradeButton").addEventListener("click", () => {
      $("#bookApp").style.display = "none";
      $("#startPage").style.display = "grid";
      $("#gradeForm").reset();
    });
  </script>
</body>
</html>
